name: rake

on: [push]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby:
        # https://hub.docker.com/_/ruby
        - '3.3'
        - '3.4'
        - '4.0'
    container:
      image: ruby:${{ matrix.ruby }}

    steps:
    - uses: actions/checkout@v7
    - name: Build and test with Rake
      run: |
        gem update bundler
        bundle install --jobs 4 --retry 3
        bundle exec rake
